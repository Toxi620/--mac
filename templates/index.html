<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配色工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    padding: 30px;
    color: #333;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 24px; color: #1d1d1f; }

  .color-grid {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  .color-item input[type="color"] { width: 36px; height: 36px; }
  .color-item {
    display: flex; align-items: center; gap: 6px;
  }
  .color-item .color-label {
    display: flex; flex-direction: column; line-height: 1.2;
  }
  .color-item .color-label .name {
    font-size: 12px; font-weight: 500; color: #333;
  }
  .color-item .color-label .hex {
    font-size: 10px; color: #999; font-family: monospace;
  }
  .color-item input[type="color"] {
    width: 36px; height: 36px; border: 2px solid #e0e0e0;
    border-radius: 8px; cursor: pointer; padding: 2px; background: none;
  }
  .color-item input[type="color"]:hover { border-color: #007aff; }
  .hex-label {
    font-size: 10px; color: #666; font-family: monospace;
  }

  .toolbar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .btn {
    padding: 8px 20px; border-radius: 8px; border: none;
    font-size: 14px; cursor: pointer; font-weight: 500;
  }
  .btn-primary { background: #007aff; color: #fff; }
  .btn-primary:hover { background: #0056b3; }
  .btn-primary:disabled { background: #999; cursor: not-allowed; }
  .btn-outline {
    background: #fff; color: #333; border: 1px solid #d0d0d0;
  }
  .btn-outline:hover { background: #f0f0f0; }
  .upload-group { display: flex; align-items: center; gap: 8px; }
  .upload-group label {
    font-size: 13px; color: #666; cursor: pointer;
    padding: 6px 14px; border: 1px dashed #aaa; border-radius: 6px;
  }
  .upload-group label:hover { border-color: #007aff; color: #007aff; }
  .upload-group input[type="file"] { display: none; }

  .status {
    font-size: 13px; color: #999; padding: 6px 0 12px;
  }
  .previews {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .previews .span2 { grid-row: span 2; }
  @media (max-width: 900px) { .previews { grid-template-columns: repeat(2, 1fr); } }
  .preview-card {
    background: #fff; border-radius: 10px; padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center;
  }
  .preview-card .name {
    font-size: 13px; color: #666; margin-bottom: 8px;
  }
  .preview-card img {
    max-width: 100%; border-radius: 4px;
    border: 1px solid #eee;
  }
  .loading { opacity: .4; pointer-events: none; }
  .spinner { display: inline-block; width: 14px; height: 14px;
    border: 2px solid #ccc; border-top-color: #007aff;
    border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
    margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 700px) { .previews { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
    <h1 style="margin:0">🎨 配色工具</h1>
    <button onclick="doShutdown()" style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer;color:#999">✕ 关闭</button>
  </div>

  <div class="color-grid" id="colorGrid" style="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
    <span style="font-size:13px;font-weight:600;color:#1d1d1f;margin-right:8px">☀️ 亮色</span>
    <div class="color-item">
      <div class="color-label">
        <span class="name">文字色</span>
        <span class="hex" id="hexText">{{ colors.文字色 }}</span>
      </div>
      <input type="color" id="colorText" value="{{ colors.文字色 }}">
    </div>
    <div class="color-item">
      <div class="color-label">
        <span class="name">tag色</span>
        <span class="hex" id="hexTag">{{ colors.tag色 }}</span>
      </div>
      <input type="color" id="colorTag" value="{{ colors.tag色 }}">
    </div>
    <div class="color-item">
      <div class="color-label">
        <span class="name">tag底板</span>
        <span class="hex" id="hexBg">{{ colors.tag底板色 }}</span>
      </div>
      <input type="color" id="colorBg" value="{{ colors.tag底板色 }}">
    </div>
    <span style="font-size:13px;font-weight:600;color:#1d1d1f;margin:0 8px">🌙 暗色</span>
    <div class="color-item">
      <div class="color-label">
        <span class="name">文字色</span>
        <span class="hex" id="hexTextDark">{{ colors.文字色_暗 }}</span>
      </div>
      <input type="color" id="colorTextDark" value="{{ colors.文字色_暗 }}">
    </div>
    <div class="color-item">
      <div class="color-label">
        <span class="name">tag色</span>
        <span class="hex" id="hexTagDark">{{ colors.tag色_暗 }}</span>
      </div>
      <input type="color" id="colorTagDark" value="{{ colors.tag色_暗 }}">
    </div>
    <div class="color-item">
      <div class="color-label">
        <span class="name">tag底板</span>
        <span class="hex" id="hexBgDark">{{ colors.tag底板色_暗 }}</span>
      </div>
      <input type="color" id="colorBgDark" value="{{ colors.tag底板色_暗 }}">
    </div>
    <span style="font-size:13px;font-weight:600;color:#1d1d1f;margin:0 8px">🌈 渐变</span>
    <div class="color-item">
      <div class="color-label">
        <span class="name">上</span>
        <span class="hex" id="hexGradTop">{{ colors.渐变上 }}</span>
      </div>
      <input type="color" id="colorGradTop" value="{{ colors.渐变上 }}">
    </div>
    <div class="color-item">
      <div class="color-label">
        <span class="name">下</span>
        <span class="hex" id="hexGradBot">{{ colors.渐变下 }}</span>
      </div>
      <input type="color" id="colorGradBot" value="{{ colors.渐变下 }}">
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="btnExport" onclick="doExport()">📥 导出高清原图</button>

    <div class="upload-group">
      <label>⬆ left_.9.png <input type="file" accept=".png" onchange="uploadBubble('left', this)"></label>
    </div>
    <div class="upload-group">
      <label>⬆ right_.9.png <input type="file" accept=".png" onchange="uploadBubble('right', this)"></label>
    </div>
    <div class="upload-group">
      <label>⬆ bg_0.png <input type="file" accept=".png" onchange="uploadBubble('bg_0', this)"></label>
    </div>
    <div class="upload-group">
      <label>⬆ bg_1.png <input type="file" accept=".png" onchange="uploadBubble('bg_1', this)"></label>
    </div>
  </div>

  <div class="status" id="status">就绪</div>
  <div class="previews" id="previews"></div>
</div>

<script>
const colorText = document.getElementById('colorText');
const colorTag = document.getElementById('colorTag');
const colorBg = document.getElementById('colorBg');
const hexText = document.getElementById('hexText');
const hexTag = document.getElementById('hexTag');
const hexBg = document.getElementById('hexBg');
const colorTextDark = document.getElementById('colorTextDark');
const colorTagDark = document.getElementById('colorTagDark');
const colorBgDark = document.getElementById('colorBgDark');
const hexTextDark = document.getElementById('hexTextDark');
const hexTagDark = document.getElementById('hexTagDark');
const hexBgDark = document.getElementById('hexBgDark');
const colorGradTop = document.getElementById('colorGradTop');
const colorGradBot = document.getElementById('colorGradBot');
const hexGradTop = document.getElementById('hexGradTop');
const hexGradBot = document.getElementById('hexGradBot');
const previewsEl = document.getElementById('previews');
const statusEl = document.getElementById('status');
const grid = document.getElementById('colorGrid');
const btnExport = document.getElementById('btnExport');

let debounceTimer = null;
let exporting = false;

// 暗色是否自动跟随浅色（用户手动调过后改为 false）
let darkAuto = { text: true, tag: true, bg: true };

function darkenHex(hex) {
  // 给 hex 颜色叠 10% 黑：每通道 ×0.9
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const f = x => Math.round(x * 0.9).toString(16).padStart(2, '0');
  return `#${f(r)}${f(g)}${f(b)}`;
}

function updateHex() {
  hexText.textContent = colorText.value;
  hexTag.textContent = colorTag.value;
  hexBg.textContent = colorBg.value;
  hexTextDark.textContent = colorTextDark.value;
  hexTagDark.textContent = colorTagDark.value;
  hexBgDark.textContent = colorBgDark.value;
  hexGradTop.textContent = colorGradTop.value;
  hexGradBot.textContent = colorGradBot.value;
}

function getColors() {
  return {
    文字色: colorText.value,
    tag色: colorTag.value,
    tag底板色: colorBg.value,
    文字色_暗: colorTextDark.value,
    tag色_暗: colorTagDark.value,
    tag底板色_暗: colorBgDark.value,
    渐变上: colorGradTop.value,
    渐变下: colorGradBot.value,
  };
}

function doPreview() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    if (exporting) return;
    grid.classList.add('loading');
    statusEl.innerHTML = '⏳ 生成预览...';

    fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(getColors())
    })
    .then(r => r.json())
    .then(data => {
      grid.classList.remove('loading');
      if (data.ok) {
        statusEl.textContent = '✅ 预览已更新';
        renderPreviews(data.previews);
      } else {
        statusEl.textContent = '❌ ' + (data.error || '生成失败');
      }
    })
    .catch(() => {
      grid.classList.remove('loading');
      statusEl.textContent = '❌ 请求失败';
    });
  }, 300);
}

function doShutdown() {
  if (confirm('确定关闭配色工具？')) {
    fetch('/shutdown', { method: 'POST' });
  }
}

function renderPreviews(data) {
  const order = ['页面1普通模式','页面2暗黑模式','商城6字展示420X174(预览)','left_night','引流位banner','right_night'];
  let html = '';
  for (let i = 0; i < order.length; i++) {
    const url = data[order[i]];
    if (!url) continue;
    const cls = 'preview-card' + (i < 2 ? ' span2' : '');
    html += `<div class="${cls}"><div class="name">${order[i]}</div><img src="${url}"></div>`;
  }
  previewsEl.innerHTML = html;
}

function doExport() {
  if (exporting) return;
  exporting = true;
  btnExport.disabled = true;
  colorText.disabled = colorTag.disabled = colorBg.disabled = true;
  colorTextDark.disabled = colorTagDark.disabled = colorBgDark.disabled = true;
  colorGradTop.disabled = colorGradBot.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span> 导出高清原图中...';

  fetch('/export', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(getColors())
  })
  .then(r => {
    if (!r.ok) return r.json().then(d => { throw new Error(d.error || '导出失败'); });
    return r.blob();
  })
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '12聊天气泡.zip';
    document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
    exporting = false;
    btnExport.disabled = false;
    colorText.disabled = colorTag.disabled = colorBg.disabled = false;
    colorTextDark.disabled = colorTagDark.disabled = colorBgDark.disabled = false;
    colorGradTop.disabled = colorGradBot.disabled = false;
    statusEl.textContent = '✅ 导出完成';
  })
  .catch(err => {
    exporting = false;
    btnExport.disabled = false;
    colorText.disabled = colorTag.disabled = colorBg.disabled = false;
    colorTextDark.disabled = colorTagDark.disabled = colorBgDark.disabled = false;
    colorGradTop.disabled = colorGradBot.disabled = false;
    statusEl.textContent = '❌ ' + err.message;
  });
}

function uploadBubble(side, input) {
  const file = input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('side', side);
  form.append('file', file);
  statusEl.textContent = `⏳ 上传 ${side}_.9.png...`;
  fetch('/upload_bubble', { method: 'POST', body: form })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        statusEl.textContent = `✅ ${data.file} 已更新，刷新预览...`;
        doPreview();
      } else {
        statusEl.textContent = '❌ ' + (data.error || '上传失败');
      }
    });
  input.value = '';
}

colorText.addEventListener('input', () => {
  if (darkAuto.text) colorTextDark.value = darkenHex(colorText.value);
  updateHex(); doPreview();
});
colorTag.addEventListener('input', () => {
  if (darkAuto.tag) colorTagDark.value = darkenHex(colorTag.value);
  updateHex(); doPreview();
});
colorBg.addEventListener('input', () => {
  if (darkAuto.bg) colorBgDark.value = darkenHex(colorBg.value);
  updateHex(); doPreview();
});

colorTextDark.addEventListener('input', () => {
  darkAuto.text = false;
  updateHex(); doPreview();
});
colorTagDark.addEventListener('input', () => {
  darkAuto.tag = false;
  updateHex(); doPreview();
});
colorBgDark.addEventListener('input', () => {
  darkAuto.bg = false;
  updateHex(); doPreview();
});
colorGradTop.addEventListener('input', () => { updateHex(); doPreview(); });
colorGradBot.addEventListener('input', () => { updateHex(); doPreview(); });

document.addEventListener('DOMContentLoaded', () => {
  // 初始同步：暗色 = 浅色 ×0.9
  colorTextDark.value = darkenHex(colorText.value);
  colorTagDark.value = darkenHex(colorTag.value);
  colorBgDark.value = darkenHex(colorBg.value);
  updateHex();
  doPreview();
});
</script>
</body>
</html>
