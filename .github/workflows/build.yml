name: 打包 Mac 版

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write   # 删旧 artifact 需要（默认 token 只读会 403）

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 清理旧成品（腾 artifact 存储配额，免费档只有 500MB）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/artifacts" \
                     --paginate --jq '.artifacts[].id' 2>/dev/null); do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && \
              echo "已删除旧 artifact $id" || true
          done
          exit 0   # 清理只是腾地方，失败不挡打包

      - name: 安装依赖
        run: pip3 install --break-system-packages pillow numpy flask pyinstaller

      - name: 打包
        run: |
          chmod +x build.command
          ./build.command

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 配色工具-Mac
          path: 配色工具
          retention-days: 3   # 拿到就够，防配额再满
